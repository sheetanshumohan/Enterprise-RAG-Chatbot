name: CI / Production Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Unit & Component Tests (Render Target)
  # ============================================================================
  test-backend:
    name: Backend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          pytest tests/test_bm25_index.py tests/test_chunker.py tests/test_citation_scoring.py tests/test_evaluation_metrics.py tests/test_extractors.py tests/test_ingest_document.py tests/test_opensearch_index.py tests/test_reranker.py tests/test_retrieval_fusion.py tests/test_sse_serialization.py -v

  # ============================================================================
  # 2. Deep End-to-End (E2E) Integration Tests
  # ============================================================================
  test-e2e:
    name: Deep E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Deep E2E Test Suite
        run: |
          cd apps/backend
          pytest tests/test_e2e_deep.py tests/test_api_integration.py -v

  # ============================================================================
  # 3. Frontend UI & Client Tests (Vercel Target)
  # ============================================================================
  test-frontend:
    name: Frontend UI & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Frontend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/frontend
          pip install -e ".[dev]"

      - name: Run Frontend Pytest Suite
        run: |
          cd apps/frontend
          pytest -v

  # ============================================================================
  # 4. Render Docker Containers Build Validation (Backend & Worker)
  # ============================================================================
  build-render-containers:
    name: Validate Render Docker Builds
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e, test-frontend]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container (Render)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: ka-backend:test

      - name: Build Worker Container (Render)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          tags: ka-worker:test
