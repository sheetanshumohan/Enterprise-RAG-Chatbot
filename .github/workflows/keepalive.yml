name: "Keep-Alive / Prevent Inactivity Suspension"

on:
  schedule:
    # Triggers automatically twice daily (00:00 & 12:00 UTC)
    - cron: "0 0,12 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  heartbeat:
    name: Cloud Cluster Heartbeat (Neon, Upstash, Qdrant, Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ping Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx sqlalchemy asyncpg redis qdrant-client

      - name: Execute Keep-Alive Heartbeat
        env:
          BACKEND_URL: ${{ secrets.KNOWLEDGE_ASSISTANT_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python apps/backend/scripts/keepalive_ping.py
