name: CD / Continuous Deployment & Production Pipeline

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment Environment Target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Quality Gates (Backend, Deep E2E, Frontend)
  # ============================================================================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          pytest tests/test_bm25_index.py tests/test_chunker.py tests/test_citation_scoring.py tests/test_evaluation_metrics.py tests/test_extractors.py tests/test_ingest_document.py tests/test_opensearch_index.py tests/test_reranker.py tests/test_retrieval_fusion.py tests/test_sse_serialization.py -v

  test-e2e:
    name: Deep E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Deep E2E Integration Tests
        run: |
          cd apps/backend
          pytest tests/test_e2e_deep.py tests/test_api_integration.py -v

  test-frontend:
    name: Frontend Streamlit & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/frontend
          pip install -e ".[dev]"

      - name: Run Frontend Pytest Suite
        run: |
          cd apps/frontend
          pytest -v

  # ============================================================================
  # Stage 2: Container Image Build & Artifact Packaging
  # ============================================================================
  build-containers:
    name: Build & Package Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e, test-frontend]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: ka-backend:${{ github.sha }}

      - name: Build Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          tags: ka-worker:${{ github.sha }}

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: ka-frontend:${{ github.sha }}

  # ============================================================================
  # Stage 3: Automated Deployment to Production / Staging
  # ============================================================================
  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e, test-frontend, build-containers]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy FastAPI Backend Service
        if: env.RENDER_BACKEND_HOOK != ''
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering backend deployment on Render..."
          curl -f -X POST "${RENDER_BACKEND_HOOK}"

      - name: Deploy Celery Ingestion Worker
        if: env.RENDER_WORKER_HOOK != ''
        env:
          RENDER_WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: |
          echo "Triggering worker deployment on Render..."
          curl -f -X POST "${RENDER_WORKER_HOOK}"

      - name: Deploy Streamlit Frontend UI
        if: env.RENDER_FRONTEND_HOOK != ''
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering frontend deployment on Render..."
          curl -f -X POST "${RENDER_FRONTEND_HOOK}"

      - name: Deployment Summary
        run: |
          echo "===================================================="
          echo " Deployment Triggered Successfully for commit ${{ github.sha }}"
          echo " Target Environment: ${{ inputs.target_env || 'production' }}"
          echo "===================================================="
