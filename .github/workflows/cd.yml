name: "CD / Continuous Deployment (Backend: Render, Frontend: Streamlit Cloud)"

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Quality Gates (Backend, Deep E2E, Frontend)
  # ============================================================================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          pytest tests/test_bm25_index.py tests/test_chunker.py tests/test_citation_scoring.py tests/test_evaluation_metrics.py tests/test_extractors.py tests/test_ingest_document.py tests/test_opensearch_index.py tests/test_reranker.py tests/test_retrieval_fusion.py tests/test_sse_serialization.py -v

  test-e2e:
    name: Deep E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Deep E2E Integration Tests
        run: |
          cd apps/backend
          pytest tests/test_e2e_deep.py tests/test_api_integration.py -v

  test-frontend:
    name: Frontend UI & Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          cd apps/frontend
          pip install -e ".[dev]"

      - name: Run Frontend Pytest Suite
        run: |
          cd apps/frontend
          pytest -v

  # ============================================================================
  # Stage 2A: Deploy Backend & Worker Services to Render
  # ============================================================================
  deploy-backend-render:
    name: Deploy Backend & Worker to Render
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Trigger FastAPI Backend Deploy on Render
        if: env.RENDER_BACKEND_HOOK != ''
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering FastAPI Backend deployment on Render..."
          curl -f -X POST "${RENDER_BACKEND_HOOK}"
          echo "✅ Backend deploy signal dispatched."

      - name: Trigger Celery Ingestion Worker Deploy on Render
        if: env.RENDER_WORKER_HOOK != ''
        env:
          RENDER_WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering Celery Worker deployment on Render..."
          curl -f -X POST "${RENDER_WORKER_HOOK}"
          echo "✅ Worker deploy signal dispatched."

  # ============================================================================
  # Stage 2B: Frontend Continuous Deployment on Streamlit Community Cloud
  # ============================================================================
  deploy-frontend-streamlit:
    name: Streamlit Community Cloud Deployment
    runs-on: ubuntu-latest
    needs: [test-backend, test-e2e, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Streamlit App Structure
        run: |
          test -f apps/frontend/app.py && echo "✅ apps/frontend/app.py entrypoint verified."
          echo "Streamlit Community Cloud automatically auto-deploys updates on push to main branch."

  # ============================================================================
  # Stage 3: Deployment Summary
  # ============================================================================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend-render, deploy-frontend-streamlit]
    if: always()
    steps:
      - name: Report Deployment Status
        run: |
          echo "===================================================="
          echo " 🎉 Continuous Deployment Complete"
          echo " Commit: ${{ github.sha }}"
          echo " Target Environment: ${{ inputs.target_env || 'production' }}"
          echo " - Backend & Worker: Render"
          echo " - Frontend: Streamlit Community Cloud (share.streamlit.io)"
          echo "===================================================="
